<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How to Rebuild Everything</title>
<link rel="icon" href="data:,">
<style>
  /*
   * A style is these values and nothing else: the five tones every figure is
   * drawn in, the page's ink, and the line weight. Change them here, or add
   * a block below and a button for it, to try another look.
   */
  :root, :root[data-style="light"] {
    color-scheme: light;
    --hairline-plate: #ffffff; --hairline-hi: #232327; --hairline-edge: #a4a4ac; --hairline-mid: #c3c3c9; --hairline-lo: #e0e0e4;
    --ink: #232327; --muted: #6f6f78;
  }
  :root[data-style="dark"] {
    color-scheme: dark;
    --hairline-plate: #08090a; --hairline-hi: #d0d6e0; --hairline-edge: #5b5d64; --hairline-mid: #3e3e44; --hairline-lo: #29292d;
    --ink: #d0d6e0; --muted: #8a8c95;
  }
  :root[data-style="blueprint"] {
    color-scheme: dark;
    --hairline-plate: #12305a; --hairline-hi: #ffffff; --hairline-edge: #9dbde6; --hairline-mid: #6f95c8; --hairline-lo: #3d629a;
    --ink: #f2f6fb; --muted: #9dbde6;
  }
  :root[data-style="signal"] {
    color-scheme: dark;
    --hairline-plate: #0b0b0c; --hairline-hi: #ec4e02; --hairline-edge: #77777f; --hairline-mid: #4a4a51; --hairline-lo: #2c2c31;
    --ink: #e8e8ea; --muted: #8a8c95;
  }
  :root { --hairline-stroke: 0.9; --ground: var(--hairline-plate); --line: var(--hairline-lo); }

  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 48px 16px 80px; background: var(--ground); color: var(--ink);
    font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased;
    transition: background-color 260ms cubic-bezier(0.5, 0, 0.1, 1), color 260ms cubic-bezier(0.5, 0, 0.1, 1);
  }
  main { max-width: 760px; margin: 0 auto; }
  .mono, .tag, output, button { font: 11px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.02em; }
  .kicker { margin: 0 0 10px; color: var(--muted); }
  h1 { margin: 0; font-size: 26px; line-height: 1.2; font-weight: 500; letter-spacing: -0.015em; text-wrap: balance; }
  .lede { max-width: 56ch; margin: 10px 0 0; color: var(--muted); text-wrap: pretty; }

  .figures { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 28px 16px; margin-top: 32px; }
  figure { margin: 0; min-width: 0; }
  .plate { position: relative; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .stage:focus-visible { outline: 1.5px solid var(--ink); outline-offset: -4px; border-radius: 12px; }
  .tag { position: absolute; top: 12px; z-index: 1; color: var(--muted); pointer-events: none; }
  .tag.name { left: 14px; }
  .tag.read { right: 14px; color: var(--ink); font-variant-numeric: tabular-nums; }
  figcaption { margin: 12px 2px 0; text-wrap: pretty; }

  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin-top: 18px; }
  .controls .mono { color: var(--muted); }
  .slider { flex: 1 1 220px; min-width: 0; display: flex; align-items: center; gap: 12px; }
  .break { flex-basis: 100%; height: 0; }
  input[type="range"] { flex: 1 1 96px; min-width: 0; height: 32px; margin: 0; background: transparent; cursor: pointer; -webkit-appearance: none; appearance: none; }
  input[type="range"]::-webkit-slider-runnable-track { height: 1px; background: var(--muted); }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 13px; height: 13px; margin-top: -6px; border-radius: 50%; border: 1px solid var(--ink); background: var(--ground); }
  input[type="range"]::-moz-range-track { height: 1px; background: var(--muted); }
  input[type="range"]::-moz-range-thumb { width: 11px; height: 11px; border-radius: 50%; border: 1px solid var(--ink); background: var(--ground); }
  input[type="range"]:focus-visible, button:focus-visible { outline: 1.5px solid var(--ink); outline-offset: 2px; }
  output { min-width: 4ch; text-align: right; font-variant-numeric: tabular-nums; }
  button { height: 32px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--ink); cursor: pointer; }
  button[aria-pressed="true"] { background: var(--ink); color: var(--ground); border-color: var(--ink); }
  .styles { display: flex; flex-wrap: wrap; gap: 6px; }
  #error { margin: 12px 0 0; padding-left: 10px; border-left: 1px solid var(--ink); }
</style>
</head>
<body>
<main>
  <p class="mono kicker">a collection · first sketch</p>
  <h1>How to Rebuild Everything</h1>
  <p class="lede">Things taken apart and drawn in one line weight. Move across a figure to put it back together, and drag to turn it in your hand.</p>

  <div class="figures" id="figures"></div>
  <p id="error" role="alert" hidden></p>

  <div class="controls">
    <span class="slider">
      <label class="mono" for="spread">spread</label>
      <input id="spread" type="range" min="0" max="1" step="0.01" value="0.5">
      <output id="spread-value" for="spread"></output>
    </span>
    <span class="slider">
      <label class="mono" for="weight">line</label>
      <input id="weight" type="range" min="0.5" max="2" step="0.05" value="0.9">
      <output id="weight-value" for="weight"></output>
    </span>
    <span class="break"></span>
    <span class="mono">style</span>
    <span class="styles" id="styles">
      <button type="button" data-style="light">light</button>
      <button type="button" data-style="dark">dark</button>
      <button type="button" data-style="blueprint">blueprint</button>
      <button type="button" data-style="signal">signal</button>
    </span>
    <span class="mono" style="margin-left:auto">view</span>
    <button id="home" type="button">home</button>
  </div>
</main>

<script src="engine/kernel.js"></script>
<script src="engine/orbit.js"></script>
<script>
/*
 * The page a figure is shown on. A figure file calls REBUILD.figure({ no, name,
 * means, range, mount }), in the shape of a Hairline figure: mount is handed
 * { stage, svg, read } and a number, and gives back { set, destroy }.
 */
var REBUILD = (() => {
  const $ = (id) => document.getElementById(id);
  const root = document.documentElement;
  const store = {
    get: (k) => { try { return localStorage.getItem("rebuild-" + k); } catch { return null; } },
    set: (k, v) => { try { localStorage.setItem("rebuild-" + k, v); } catch { /* a private window */ } },
  };

  addEventListener("error", (e) => {
    $("error").hidden = false;
    $("error").textContent = String((e.error && e.error.message) || e.message);
  });

  /* the style: one attribute on the page, remembered */
  const buttons = [...$("styles").querySelectorAll("button")];
  function setStyle(name) {
    if (!buttons.some((b) => b.dataset.style === name)) name = "light";
    root.dataset.style = name;
    buttons.forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.style === name)));
    store.set("style", name);
  }
  buttons.forEach((b) => b.addEventListener("click", () => setStyle(b.dataset.style)));
  setStyle(store.get("style") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));

  /* the line weight, in CSS pixels at any size */
  function setWeight(w) {
    root.style.setProperty("--hairline-stroke", String(w));
    $("weight").value = String(w);
    $("weight-value").textContent = Number(w).toFixed(2);
    store.set("weight", String(w));
  }
  $("weight").addEventListener("input", (e) => setWeight(e.target.value));
  setWeight(Number(store.get("weight")) || 0.9);

  const mounted = [];
  $("spread-value").textContent = Number($("spread").value).toFixed(2);
  $("spread").addEventListener("input", (e) => {
    $("spread-value").textContent = Number(e.target.value).toFixed(2);
    mounted.forEach((m) => m.handle.set(m.at(Number(e.target.value))));
  });
  $("home").addEventListener("click", () => mounted.forEach((m) => m.handle.scene && m.handle.scene.home()));

  function figure(spec) {
    /* the slider to the figure's own number: two straight lines that meet at 0.5, as in Hairline */
    const [lo, mid, hi] = spec.range;
    const at = (i) => Math.round((i <= 0.5 ? lo + (i / 0.5) * (mid - lo) : mid + ((i - 0.5) / 0.5) * (hi - mid)) * 1000) / 1000;

    const card = document.createElement("figure");
    card.innerHTML = '<div class="plate"><span class="tag name"></span><span class="tag read"></span><div class="stage" tabindex="0" role="img"></div></div><figcaption></figcaption>';
    card.querySelector(".name").textContent = spec.no + " " + spec.name;
    card.querySelector("figcaption").textContent = spec.means;
    $("figures").appendChild(card);

    const stage = card.querySelector(".stage"), out = card.querySelector(".read");
    HL.inject(document);
    stage.setAttribute("data-hairline", spec.name);
    stage.setAttribute("aria-label", spec.means + " Arrow keys turn it; Home returns the view.");
    const svg = HL.mk("svg", { viewBox: "0 0 400 320", "aria-hidden": "true" }, stage);
    const read = { get textContent() { return out.textContent; }, set textContent(v) { const t = v == null ? "" : String(v); if (out.textContent !== t) out.textContent = t; } };

    const handle = spec.mount({ stage, svg, read }, at(Number($("spread").value)));
    mounted.push({ spec, handle, at });
  }

  return { figure, mounted };
})();
</script>
<script src="figures/camera.js"></script>
</body>
</html>
